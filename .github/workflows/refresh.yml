name: Refresh and deploy

on:
  schedule:
    # Best-effort every 10 minutes; GitHub can delay or drop scheduled runs under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The merge ledger lives outside the repo, so carry it between runs in the
      # Actions cache instead of committing data churn on every refresh.
      - name: Restore deal ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            .deal-state.json
            .creators-token.json
          key: deal-state-${{ github.run_id }}
          restore-keys: |
            deal-state-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Amazon and Flipkart
        continue-on-error: true
        env:
          DEBUG_AMAZON: "1"
          DEBUG_FLIPKART: "1"
          # Official Amazon Creators API credentials. When present the API rows
          # are merged with the scraped ones (IP-independent, so they work from CI
          # too). Unset means the scraper is the only Amazon source.
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          # Optional: a residential proxy removes the datacenter IP's robot
          # interstitial entirely. Leave the secret unset to scrape direct.
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: npm run scrape

      - name: Summarise snapshot
        run: |
          node -e '
            const d = require("./public/deals.json");
            console.log("updatedAt :", d.updatedAt);
            console.log("amazon    :", d.amazon.total, d.amazon.status);
            console.log("flipkart  :", d.flipkart.total, d.flipkart.status);
            console.log("total     :", d.total);
          '

      - name: Stamp sitemap
        run: |
          node -e '
            const fs = require("fs");
            const d = require("./public/deals.json");
            const p = "public/sitemap.xml";
            const day = (d.updatedAt || new Date().toISOString()).slice(0, 10);
            fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace(/<lastmod>[^<]*<\/lastmod>/, `<lastmod>${day}</lastmod>`));
            console.log("sitemap lastmod ->", day);
          '

      # The push endpoints need a KV namespace bound as SUBS and PUSH_ADMIN_SECRET
      # stored as a Pages secret. Both are created here with the same token the
      # deploy uses, so enabling deal alerts needs no dashboard step. Non-fatal: a
      # token that cannot manage KV leaves push unconfigured but must not stop the
      # feed from deploying.
      - name: Provision push storage
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH_ADMIN_SECRET: ${{ secrets.PUSH_ADMIN_SECRET }}
        run: node scripts/provision-push.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set — skipping deploy."
            exit 0
          fi
          npx wrangler pages deploy public \
            --project-name=deal-grabber \
            --branch=main \
            --commit-dirty=true

      - name: Save deal ledger
        if: hashFiles('.deal-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .deal-state.json
            .creators-token.json
          key: deal-state-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days without a commit, so
      # leave a tiny heartbeat well before that. Pushes made with GITHUB_TOKEN do
      # not re-trigger this workflow, so there is no loop.
      - name: Keep the schedule alive
        run: |
          git config user.name "deal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $AGE_DAYS"
          if [ "$AGE_DAYS" -lt 45 ]; then exit 0; fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "chore: keep scheduled workflow enabled"
          git push
